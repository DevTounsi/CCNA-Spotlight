name: Build & Release CCNA Spotlight

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build Standalone Executable
        run: |
          pyinstaller --noconsole --onefile --icon="assets/icon.ico" --name="CCNA-Spotlight" --add-data "data;data" --add-data "extracted_images;extracted_images" --add-data "assets;assets" mini_app.py

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CCNA-Spotlight-Windows
          path: dist/CCNA-Spotlight.exe

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CCNA-Spotlight.exe
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
